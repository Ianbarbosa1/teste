    <div id="root"></div>

  <style>
    *{
      padding: 0;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      box-sizing: border-box;
    }

    .container{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction:column;
      gap: 20px;
      background-color: wheat;
      & h1{
        color: tomato;
        font-size: 30px;
        font-weight: 700;
      }
      & h2{
        font-weight: 500;
      }
      & button{
        padding:5px 10px;
        border: none;
        background-color: cornflowerblue;
        color: white;
        border-radius: 5px;
        cursor: pointer;
        &:hover{
          color: red;
          transition: 0.3s ease-in-out;
        }
      }
      & img{
        border-radius: 5px;
        height: 350px;
        width: 600px;
      }
    }

  </style>
